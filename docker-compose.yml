services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: icd
      MYSQL_USER: app_user
      MYSQL_PASSWORD: secret
    volumes:
      - dbdata:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3307:3306"
    healthcheck:
      # Ping over TCP: during first-time init MySQL runs without networking, so this only succeeds when it is really ready.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    # Database settings come from .env if it exists (Task 2: remote server),
    # otherwise the local "db" container is used.
    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_NAME: ${DB_NAME:-icd}
      DB_USER: ${DB_USER:-app_user}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - ./backend:/var/www/html
      - ./data:/data
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata: